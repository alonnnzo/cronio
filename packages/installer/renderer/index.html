<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cronio</title>
  <link rel="stylesheet" href="fonts.css" />

</head>
<body>

      <span class="luz" id="luz-puente"></span>

    </div>
    <p class="version-programa" id="version-programa"></p>
  </aside>
  <div id="franja" class="franja" role="status" hidden></div>
  <main id="contenido" tabindex="-1"></main>
  <script src="app.js"></script>
