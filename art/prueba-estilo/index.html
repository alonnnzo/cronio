<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de estilo — 3DS Agent Companion</title>
<style>
  :root { --bg:#14131c; --panel:#1e1c2b; --ink:#ece9f5; --mute:#9a96b3; --line:#34314a; --accent:#7fe0f0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; padding:24px 16px 48px; }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--mute); margin: 0 0 20px; max-width: 62ch; }
  .row { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
  figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  figcaption { color:var(--mute); font-size:13px; margin-top:10px; }
  svg { display:block; }
  .screen { border-radius:4px; overflow:hidden; background:#000; }
  .controls { display:flex; gap:8px; margin: 0 0 20px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; }
  button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  .led { width:12px; height:12px; border-radius:50%; margin-left:8px; background:#333; transition: background .2s; }
  .led-label { color:var(--mute); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Prueba de estilo: retrato por capas</h1>
  <p class="lead">Un solo personaje dibujado por código. Las tres expresiones cambian solo ojos, cejas, boca y efectos.
  El movimiento sale de una tabla de fotogramas clave, la misma que leería la 3DS.</p>

  <div class="controls" id="controls">
    <button data-exp="tranquilo" aria-pressed="true">Tranquilo</button>
    <button data-exp="alerta" aria-pressed="false">Alerta</button>
    <button data-exp="contento" aria-pressed="false">Contento</button>
    <span class="led" id="led"></span><span class="led-label" id="ledLabel">LED apagado</span>
  </div>

  <div class="row">
    <figure>
      <div class="screen" style="width:400px;height:240px">
        <svg id="top" width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <figcaption>Pantalla superior a tamaño real (400 × 240). Retrato de 192 × 240.</figcaption>
    </figure>
    <figure>
      <svg id="zoom" width="384" height="480" viewBox="0 0 192 240" xmlns="http://www.w3.org/2000/svg"></svg>
      <figcaption>El mismo retrato ampliado ×2, para revisar el dibujo.</figcaption>
    </figure>
  </div>
</main>

<script>
// ---------- Paleta (cambiar traje o pelo = cambiar estos valores) ----------
const PAL = {
  line:'#1e1b3a', skin:'#ffe6d5', skinSh:'#f2bfa6', hair:'#2d3266', hairHi:'#5a66c4',
  eye:'#35c3e6', eyeDark:'#1565a8', pupil:'#12203a', cloth:'#fff4e6', clothSh:'#e9d6c2',
  accent:'#ff8a4c', mouth:'#c8445a', blush:'#ff8f85'
};

// ---------- Personaje: piezas con nombre (data-l = capa animable, data-part = pieza intercambiable) ----------
function eyeOpen(cx) {
  return `<g transform="translate(${cx} 110)"><g data-l="eye" data-p="0,0">
    <ellipse rx="9" ry="10.5" fill="#fff"/>
    <ellipse cy="1" rx="7.2" ry="9" fill="url(#iris)"/>
    <g data-l="pupil" data-p="0,2"><ellipse cy="2" rx="3" ry="4.6" fill="${PAL.pupil}"/></g>
    <circle cx="-3" cy="-4" r="2.6" fill="#fff"/>
    <circle cx="3.6" cy="5.2" r="1.2" fill="#fff" opacity=".85"/>
    <path d="M-11.5 -4.5 C-7 -13 7 -13 11.5 -4.5" fill="none" stroke="${PAL.line}" stroke-width="3" stroke-linecap="round"/>
    <path d="M-8 9.6 C-4 11.6 4 11.6 8 9.6" fill="none" stroke="${PAL.line}" stroke-width="1" opacity=".45" stroke-linecap="round"/>
  </g></g>`;
}
function eyeHappy(cx) {
  return `<path transform="translate(${cx} 110)" d="M-10 3 C-5 -7 5 -7 10 3" fill="none" stroke="${PAL.line}" stroke-width="3" stroke-linecap="round"/>`;
}
function star(x, y, s) {
  return `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -8 Q1.4 -1.4 8 0 Q1.4 1.4 0 8 Q-1.4 1.4 -8 0 Q-1.4 -1.4 0 -8Z" fill="#fff6a8" stroke="${PAL.line}" stroke-width="1"/>`;
}

function character() {
  const L = PAL.line;
  return `
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${PAL.eyeDark}"/><stop offset="1" stop-color="${PAL.eye}"/>
    </linearGradient>
  </defs>
  <g class="ch">
    <g data-l="hairBack" data-p="96,70">
      <path d="M46 92 C40 34 152 34 146 92 C150 126 147 150 139 160 C120 151 72 151 53 160 C45 150 42 126 46 92Z" fill="${PAL.hair}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <g data-l="body" data-p="96,240"><g transform="translate(-14.4 -37.8) scale(1.15)">
      <path d="M62 180 C68 160 124 160 130 180 C118 192 74 192 62 180Z" fill="${PAL.accent}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M86 138 L86 170 C92 180 100 180 106 170 L106 138Z" fill="${PAL.skin}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M86 146 C92 154 100 154 106 146 L106 141 L86 141Z" fill="${PAL.skinSh}"/>
      <path d="M26 242 C28 202 44 184 80 172 L96 190 L112 172 C148 184 164 202 166 242Z" fill="${PAL.cloth}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M38 242 C40 214 46 198 58 190 C52 208 52 226 54 242Z" fill="${PAL.clothSh}"/>
      <path d="M154 242 C152 214 146 198 134 190 C140 208 140 226 138 242Z" fill="${PAL.clothSh}"/>
      <path d="M88 184 L86 208 M104 184 L106 208" stroke="${PAL.accent}" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="86" cy="210" r="2.2" fill="${PAL.accent}" stroke="${L}" stroke-width="1"/>
      <circle cx="106" cy="210" r="2.2" fill="${PAL.accent}" stroke="${L}" stroke-width="1"/>
      <path d="M96 218 L102 226 L96 234 L90 226Z" fill="${PAL.accent}" stroke="${L}" stroke-width="1.5" stroke-linejoin="round"/>
    </g></g>

    <g data-l="head" data-p="96,146">
      <path d="M56 90 C56 118 74 139 96 147 C118 139 136 118 136 90 C136 46 56 46 56 90Z" fill="${PAL.skin}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M58 92 C60 70 132 70 134 92 C128 84 112 80 96 80 C80 80 64 84 58 92Z" fill="${PAL.skinSh}" opacity=".7"/>
      <g data-l="blush" data-p="96,123">
        <ellipse cx="68" cy="123" rx="7" ry="3.4" fill="${PAL.blush}"/>
        <ellipse cx="124" cy="123" rx="7" ry="3.4" fill="${PAL.blush}"/>
      </g>
      <path d="M95 120 L97 122" stroke="${PAL.skinSh}" stroke-width="2" stroke-linecap="round"/>

      <g data-part="eyes-open">${eyeOpen(78)}${eyeOpen(114)}</g>
      <g data-part="eyes-happy">${eyeHappy(78)}${eyeHappy(114)}</g>

      <path data-part="mouth-smile" d="M90 130 Q96 135 102 130" fill="none" stroke="${L}" stroke-width="2" stroke-linecap="round"/>
      <ellipse data-part="mouth-o" cx="96" cy="132" rx="3.4" ry="4.4" fill="${PAL.mouth}" stroke="${L}" stroke-width="1.5"/>
      <g data-part="mouth-grin">
        <path d="M86 127 Q96 145 106 127Z" fill="${PAL.mouth}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
        <path d="M88.5 128.2 L103.5 128.2 L102 131 L90 131Z" fill="#fff"/>
      </g>

      <g data-l="hairFront" data-p="96,50">
        <path d="M54 84 C47 100 49 122 56 138 C61 122 61 102 63 88Z" fill="${PAL.hair}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
        <path d="M138 84 C145 100 143 122 136 138 C131 122 131 102 129 88Z" fill="${PAL.hair}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
        <path d="M50 96 C42 38 150 38 142 96 C140 84 134 74 128 68 C126 78 120 86 112 91 C114 80 112 72 108 66 C102 78 90 88 78 92 C82 83 82 76 80 70 C70 76 58 84 50 96Z" fill="${PAL.hair}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
        <path d="M70 60 C78 53 90 50 100 50 M108 51 C113 52 117 54 120 57" fill="none" stroke="${PAL.hairHi}" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
        <path d="M84 47 L78 36 L92 42Z" fill="${PAL.hair}" stroke="${L}" stroke-width="2" stroke-linejoin="round"/>
        <rect x="120" y="76" width="12" height="4.5" rx="2" transform="rotate(28 126 78)" fill="${PAL.accent}" stroke="${L}" stroke-width="1.2"/>
      </g>

      <g data-l="browL" data-p="78,95"><path d="M69 96 Q78 92 87 95" fill="none" stroke="${PAL.line}" stroke-width="2.4" stroke-linecap="round"/></g>
      <g data-l="browR" data-p="114,95"><path d="M105 95 Q114 92 123 96" fill="none" stroke="${PAL.line}" stroke-width="2.4" stroke-linecap="round"/></g>
    </g>

    <g data-part="fx-alert"><g data-l="fxAlert" data-p="158,52">
      <rect x="153" y="30" width="10" height="26" rx="5" fill="#ffd23f" stroke="${L}" stroke-width="2"/>
      <circle cx="158" cy="66" r="5" fill="#ffd23f" stroke="${L}" stroke-width="2"/>
    </g></g>
    <g data-part="fx-sparkle"><g data-l="fxSparkle" data-p="96,70">
      ${star(30, 62, 1)}${star(164, 74, .8)}${star(150, 34, .55)}
    </g></g>
  </g>`;
}

// ---------- Expresiones: qué piezas se muestran y cómo se colocan ----------
const EXPRESSIONS = {
  tranquilo: { eyes:'open',  mouth:'smile', fx:null,      eyeScale:1,    pupil:1,   browY:0,  browRot:0,  blush:.35,
               text:'Todo en orden. Claude está\ntrabajando en mi-portal.', led:['#2a6bff','Pulso azul'] },
  alerta:    { eyes:'open',  mouth:'o',     fx:'alert',   eyeScale:1.13, pupil:.62, browY:-4, browRot:-9, blush:.2,
               text:'¡Claude pide permiso!\nnpm install sharp', led:['#ffd23f','Parpadeo amarillo'] },
  contento:  { eyes:'happy', mouth:'grin',  fx:'sparkle', eyeScale:1,    pupil:1,   browY:-3, browRot:4,  blush:.75,
               text:'¡Tarea terminada!\n+40 XP   +12 tokens', led:['#39d98a','Destello verde'] }
};

// ---------- Animación: fotogramas clave por capa (t de 0 a 1). Mismos datos servirían en C ----------
const ANIMS = {
  tranquilo: { dur:3400, tracks:{
    body:      [{t:0,sy:1},{t:.5,sy:1.014},{t:1,sy:1}],
    head:      [{t:0,y:0},{t:.5,y:1.3},{t:1,y:0}],
    hairFront: [{t:0,y:0},{t:.62,y:.7},{t:1,y:0}],
    hairBack:  [{t:0,r:-.7},{t:.5,r:.7},{t:1,r:-.7}] }},
  alerta: { dur:700, tracks:{
    body:      [{t:0,sy:1.01},{t:.5,sy:1.02},{t:1,sy:1.01}],
    head:      [{t:0,y:-2},{t:.5,y:-3},{t:1,y:-2}],
    hairFront: [{t:0,y:-.5},{t:.5,y:.4},{t:1,y:-.5}],
    fxAlert:   [{t:0,s:1,y:0},{t:.5,s:1.18,y:-2},{t:1,s:1,y:0}] }},
  contento: { dur:1200, tracks:{
    body:      [{t:0,sy:1},{t:.5,sy:1.02},{t:1,sy:1}],
    head:      [{t:0,y:0,r:-2.5},{t:.25,y:-3,r:0},{t:.5,y:0,r:2.5},{t:.75,y:-3,r:0},{t:1,y:0,r:-2.5}],
    hairFront: [{t:0,y:0},{t:.3,y:1},{t:.5,y:0},{t:.8,y:1},{t:1,y:0}],
    hairBack:  [{t:0,r:2},{t:.5,r:-2},{t:1,r:2}],
    fxSparkle: [{t:0,s:.85},{t:.5,s:1.12},{t:1,s:.85}] }}
};
const DEFAULTS = { x:0, y:0, r:0, s:1, sx:1, sy:1 };

function sample(track, t) {
  let a = track[0], b = track[track.length - 1];
  for (let i = 0; i < track.length - 1; i++) if (t >= track[i].t && t <= track[i + 1].t) { a = track[i]; b = track[i + 1]; break; }
  const k = b.t === a.t ? 0 : (t - a.t) / (b.t - a.t);
  const e = .5 - .5 * Math.cos(Math.PI * k); // suavizado
  const out = {};
  for (const p in DEFAULTS) {
    const va = a[p] ?? DEFAULTS[p], vb = b[p] ?? DEFAULTS[p];
    out[p] = va + (vb - va) * e;
  }
  return out;
}
function setLayer(name, v) {
  document.querySelectorAll(`[data-l="${name}"]`).forEach(el => {
    const [px, py] = el.dataset.p.split(',').map(Number);
    const o = { ...DEFAULTS, ...v };
    el.setAttribute('transform',
      `translate(${o.x + px} ${o.y + py}) rotate(${o.r}) scale(${o.s * o.sx} ${o.s * o.sy}) translate(${-px} ${-py})`);
  });
}

// ---------- Escena de la pantalla superior ----------
function scene() {
  let stars = '';
  [[276,38],[300,58],[330,34],[352,66],[314,82],[286,92],[344,96]].forEach(([x,y],i) =>
    stars += `<circle cx="${x}" cy="${y}" r="${i%3?1:1.5}" fill="#fff" opacity="${.5+.1*(i%4)}"/>`);
  return `
  <defs><linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2657"/><stop offset="1" stop-color="#443a7a"/></linearGradient></defs>
  <rect width="400" height="240" fill="url(#wall)"/>
  <rect x="262" y="24" width="112" height="86" rx="4" fill="#0f1433" stroke="#191636" stroke-width="4"/>
  ${stars}<circle cx="352" cy="44" r="9" fill="#fff3c4"/>
  <path d="M318 24 V110 M262 67 H374" stroke="#191636" stroke-width="3"/>
  <rect x="0" y="0" width="400" height="16" fill="#151228" opacity=".85"/>
  <text x="6" y="12" font="700 10px system-ui" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fff">Nv 3</text>
  <rect x="34" y="5" width="60" height="6" rx="3" fill="#34314a"/><rect x="34" y="5" width="38" height="6" rx="3" fill="#7fe0f0"/>
  <text x="394" y="12" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#fff">Energía 80%   Tokens 120</text>
  <g transform="translate(2 0)">${character()}</g>
  <rect x="176" y="150" width="216" height="80" rx="8" fill="#151228" opacity=".92" stroke="#7fe0f0" stroke-width="1.5"/>
  <rect x="186" y="142" width="46" height="16" rx="8" fill="#7fe0f0"/>
  <text x="209" y="154" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#151228">Mika</text>
  <text id="dlg" x="188" y="180" font-family="system-ui,sans-serif" font-size="12" fill="#fff"></text>`;
}

document.getElementById('top').innerHTML = scene();
document.getElementById('zoom').innerHTML = `<rect width="192" height="240" fill="#2f2a5e"/>` + character();

// ---------- Estado y bucle ----------
let current = 'tranquilo', t0 = performance.now(), blinkAt = t0 + 1800, blinkStart = -1;

function show(part, on) { document.querySelectorAll(`[data-part="${part}"]`).forEach(el => el.style.display = on ? '' : 'none'); }
function setExpression(name) {
  current = name; t0 = performance.now();
  const e = EXPRESSIONS[name];
  show('eyes-open', e.eyes === 'open'); show('eyes-happy', e.eyes === 'happy');
  ['smile','o','grin'].forEach(m => show('mouth-' + m, e.mouth === m));
  show('fx-alert', e.fx === 'alert'); show('fx-sparkle', e.fx === 'sparkle');
  setLayer('browL', { y:e.browY, r:e.browRot }); setLayer('browR', { y:e.browY, r:-e.browRot });
  setLayer('pupil', { s:e.pupil });
  document.querySelectorAll('[data-l="blush"]').forEach(el => el.setAttribute('opacity', e.blush));
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = e.text.split('\n').map((l, i) => `<tspan x="188" dy="${i ? 16 : 0}">${l}</tspan>`).join('');
  document.getElementById('led').style.background = e.led[0];
  document.getElementById('ledLabel').textContent = 'LED: ' + e.led[1];
  document.querySelectorAll('#controls button').forEach(b => b.setAttribute('aria-pressed', b.dataset.exp === name));
  ['body','head','hairFront','hairBack','fxAlert','fxSparkle'].forEach(l => setLayer(l, {}));
}

function frame(now) {
  const anim = ANIMS[current];
  const t = ((now - t0) % anim.dur) / anim.dur;
  for (const layer in anim.tracks) setLayer(layer, sample(anim.tracks[layer], t));

  // Parpadeo: evento suelto, no parte del bucle
  let eyeSy = 1;
  if (blinkStart < 0 && now > blinkAt) blinkStart = now;
  if (blinkStart >= 0) {
    const k = (now - blinkStart) / 170;
    if (k >= 1) { blinkStart = -1; blinkAt = now + 2200 + Math.random() * 3000; }
    else eyeSy = 1 - .92 * Math.sin(Math.PI * k);
  }
  const es = EXPRESSIONS[current].eyeScale;
  setLayer('eye', { sx: es, sy: es * eyeSy });
  requestAnimationFrame(frame);
}

document.getElementById('controls').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (b) setExpression(b.dataset.exp);
});
setExpression('tranquilo');
requestAnimationFrame(frame);
</script>
</body>
</html>
